# The dsh-completion-sound bundle patch: one loader row providing the host half
# (this package's entry Config plus the cue routes) and, through `dsh.client`,
# the browser half. The row id doubles as the settings namespace the client
# reads through `ctx.configForms`, and as the `settings.section` id the browser
# half registers its page under.
#
# DSH 0.1.7 dropped the built-in completion-sound row, so there is nothing left
# to disable here: this bundle is the profile's only completion cue.

- insert:
    - id: completion-sound
      name: '@jensentsts/dsh-completion-sound'
